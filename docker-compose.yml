services:
  krishimitra:
    build: .
    container_name: krishimitra_app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - API_HOST=0.0.0.0
      - API_PORT=8000
    volumes:
      - ./data:/app/data
      - ./vector_store:/app/vector_store
      - ./audio:/app/audio
      - ./agri_assistant.db:/app/agri_assistant.db
    restart: unless-stopped
